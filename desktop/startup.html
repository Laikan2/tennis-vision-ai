<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:"><title>Tennis Vision Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1115;color:#edf3ef;font-family:'Segoe UI',sans-serif;display:grid;place-items:center;min-height:100vh}.bar{position:absolute;top:0;left:0;right:140px;height:38px;-webkit-app-region:drag}.studio{width:520px;padding:48px}img{width:70px;height:70px}.overline{color:#bce87b;font-size:11px;letter-spacing:3px;margin:28px 0 10px}h1{font-size:40px;font-weight:600;letter-spacing:-1.5px;margin:0}p{color:#8a9da5;line-height:1.7;font-size:14px}.line{height:3px;background:#202d32;margin:35px 0 20px;overflow:hidden;border-radius:3px}.line span{display:block;width:35%;height:100%;background:#bce87b;animation:progress 1.5s infinite ease-in-out}.stage{font-size:14px}.error{color:#ff9b91}button{background:#bce87b;border:0;padding:12px 18px;border-radius:9px;font-weight:600;color:#132010;cursor:pointer;margin:12px 6px 0 0}button.secondary{background:#1b282e;color:#ccd9db}.actions{display:none}small{display:block;color:#596f79;margin-top:45px;font-size:11px;letter-spacing:1px}@keyframes progress{from{transform:translateX(-100%)}to{transform:translateX(390%)}}@media(prefers-reduced-motion:reduce){.line span{animation:none;width:100%}}
</style></head><body><div class="bar"></div><section class="studio"><img src="assets/icon.png" alt="Tennis Vision"><div class="overline">SEU ESTÚDIO DE TÊNIS</div><h1>O jogo começa aqui.</h1><p>Preparando as câmeras e o motor de análise.<br>Seus vídeos e seus dados continuam no computador.</p><div class="line"><span></span></div><div id="stage" class="stage" role="status">Iniciando Tennis Vision Studio…</div><p id="issue" class="error"></p><div id="actions" class="actions"><button onclick="window.tennisStudio.retry()">Tentar novamente</button><button class="secondary" onclick="window.tennisStudio.openLogs()">Abrir registros</button><button class="secondary" onclick="window.tennisStudio.quit()">Fechar</button></div><small>TENNIS VISION STUDIO · PROCESSAMENTO LOCAL</small></section><script>
function render(info){document.getElementById('stage').textContent=info.stage;document.getElementById('issue').textContent=info.issue||'';document.getElementById('actions').style.display=info.issue?'block':'none'}window.tennisStudio.getInfo().then(render);window.tennisStudio.onStatus(render);
</script></body></html>
