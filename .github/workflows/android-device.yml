name: Android offline device validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/android/**'
      - 'mobile/shared/**'
      - '.github/workflows/android-device.yml'
      - 'scripts/test-android-offline-ci.sh'
permissions:
  contents: read
concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated audit APKs
        working-directory: mobile/android
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          bash gradlew -PauditDevice=true assembleAudit assembleAuditAndroidTest --console=plain
      - name: Exercise offline Android 15 app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          working-directory: mobile/android
          script: bash ../../scripts/test-android-offline-ci.sh
      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-offline-validation
          retention-days: 14
          path: |
            mobile/android/app/build/reports/android-device
            mobile/android/app/build/outputs/androidTest-results
            mobile/android/app/build/reports/androidTests
