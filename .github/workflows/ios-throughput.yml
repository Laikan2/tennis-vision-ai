name: iOS detector throughput comparison
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/ios/Sources/TennisVisionCore/LocalVision.swift'
      - 'mobile/ios/Performance/**'
      - 'scripts/compare-ios-throughput.py'
      - '.github/workflows/ios-throughput.yml'
permissions:
  contents: read
jobs:
  comparison:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare unchanged baseline and common benchmark
        run: |
          set -euo pipefail
          # Compare with the actual 0.6.20 source before this change, not the
          # older 0.6.10 array implementation (which inflates the speedup).
          git fetch --depth 1 origin b2a81f85d7208e9783f152635c0f56ff0ed43bf4
          mkdir -p /tmp/tennis-baseline
          git archive FETCH_HEAD mobile/ios | tar -xf - -C /tmp/tennis-baseline
          cp mobile/ios/Package.swift /tmp/tennis-baseline/mobile/ios/Package.swift
          mkdir -p /tmp/tennis-baseline/mobile/ios/Performance
          cp -R mobile/ios/Performance/. /tmp/tennis-baseline/mobile/ios/Performance/
      - name: Baseline release timings
        working-directory: /tmp/tennis-baseline/mobile/ios
        run: swift run -c release VisionBenchmark /tmp/baseline.json > /tmp/baseline.log
      - name: Optimized release timings
        working-directory: mobile/ios
        run: swift run -c release VisionBenchmark /tmp/candidate.json > /tmp/candidate.log
      - name: Repeat in reverse order with both binaries already built
        run: |
          set -euo pipefail
          (cd mobile/ios && swift run --skip-build -c release VisionBenchmark /tmp/candidate-repeat.json > /tmp/candidate-repeat.log)
          (cd /tmp/tennis-baseline/mobile/ios && swift run --skip-build -c release VisionBenchmark /tmp/baseline-repeat.json > /tmp/baseline-repeat.log)
      - name: Check identical detections and compare timings
        run: |
          # These common fixtures must retain every detection and speed result.
          # New deliberate classification changes have separate regression tests.
          python3 scripts/compare-ios-throughput.py /tmp/baseline.json /tmp/candidate.json /tmp/comparison.json
          python3 scripts/compare-ios-throughput.py /tmp/baseline-repeat.json /tmp/candidate-repeat.json /tmp/comparison-repeat.json
      - name: Check borrowed-buffer memory safety
        if: always()
        working-directory: mobile/ios
        run: swift test --sanitize=address --filter DetectorBufferSafetyTests
      - name: Upload timings and frame signatures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-throughput-comparison
          path: |
            /tmp/baseline.json
            /tmp/candidate.json
            /tmp/comparison.json
            /tmp/baseline-repeat.json
            /tmp/candidate-repeat.json
            /tmp/comparison-repeat.json
            /tmp/baseline.log
            /tmp/candidate.log
