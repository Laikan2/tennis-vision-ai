name: iOS detector throughput comparison
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/ios/Sources/TennisVisionCore/LocalVision.swift'
      - 'mobile/ios/Performance/**'
      - 'scripts/compare-ios-throughput.py'
      - '.github/workflows/ios-throughput.yml'
permissions:
  contents: read
jobs:
  comparison:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare unchanged baseline and common benchmark
        run: |
          set -euo pipefail
          git fetch --depth 1 origin 76ffd74374a2ffbb4f538aa9b57af83106a3692b
          mkdir -p /tmp/tennis-baseline
          git archive FETCH_HEAD mobile/ios | tar -xf - -C /tmp/tennis-baseline
          cp mobile/ios/Package.swift /tmp/tennis-baseline/mobile/ios/Package.swift
          cp -R mobile/ios/Performance /tmp/tennis-baseline/mobile/ios/Performance
      - name: Baseline release timings
        working-directory: /tmp/tennis-baseline/mobile/ios
        run: swift run -c release VisionBenchmark /tmp/baseline.json > /tmp/baseline.log
      - name: Optimized release timings
        working-directory: mobile/ios
        run: swift run -c release VisionBenchmark /tmp/candidate.json > /tmp/candidate.log
      - name: Check identical detections and compare timings
        run: python3 scripts/compare-ios-throughput.py /tmp/baseline.json /tmp/candidate.json /tmp/comparison.json
      - name: Upload timings and frame signatures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-throughput-comparison
          path: |
            /tmp/baseline.json
            /tmp/candidate.json
            /tmp/comparison.json
            /tmp/baseline.log
            /tmp/candidate.log
