name: iOS native camera
on:
  push:
    paths:
      - 'mobile/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate Xcode project
        run: python3 mobile/ios/project.py
      - name: Core regression tests
        working-directory: mobile/ios
        run: swift test --parallel
      - name: Build for physical iPhone without signing
        run: xcodebuild -project mobile/ios/TennisVisionCamera.xcodeproj -scheme TennisVisionCamera -configuration Release -destination 'generic/platform=iOS' -derivedDataPath mobile/ios/DerivedData/device CODE_SIGNING_ALLOWED=NO build | tee /tmp/ios-device-build.log
      - name: Build for simulator
        run: xcodebuild -project mobile/ios/TennisVisionCamera.xcodeproj -scheme TennisVisionCamera -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile/ios/DerivedData/simulator CODE_SIGNING_ALLOWED=NO build | tee /tmp/ios-simulator-build.log
      - name: Receiver integration
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          if [ "$ARCH" = arm64 ]; then MTX_ARCH=arm64; else MTX_ARCH=amd64; fi
          curl --fail --location --retry 2 "https://github.com/bluenviron/mediamtx/releases/download/v1.21.1/mediamtx_v1.21.1_darwin_${MTX_ARCH}.tar.gz" -o /tmp/mediamtx.tar.gz
          mkdir -p /tmp/ios-receiver
          tar -xzf /tmp/mediamtx.tar.gz -C /tmp/ios-receiver
          printf 'rtsp: yes\nrtspAddress: :8554\nrtspTransports: [tcp]\nrtmp: no\nhls: no\nwebrtc: no\nsrt: no\npaths:\n  all_others:\n' > /tmp/ios-receiver/test.yml
          /tmp/ios-receiver/mediamtx /tmp/ios-receiver/test.yml > /tmp/ios-receiver.log 2>&1 &
          RECEIVER_PID=$!
          trap 'kill "$RECEIVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          python3 -m venv /tmp/ios-ffmpeg
          /tmp/ios-ffmpeg/bin/pip install imageio-ffmpeg==0.6.0
          FFMPEG=$(/tmp/ios-ffmpeg/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          cd mobile/ios
          swift run TransportSmoke > /tmp/ios-transport.log 2>&1 &
          SMOKE_PID=$!
          trap 'kill "$SMOKE_PID" "$RECEIVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if grep -q 'stream is available and online' /tmp/ios-receiver.log; then break; fi
            sleep 0.2
          done
          "$FFMPEG" -hide_banner -loglevel error -xerror -rtsp_transport tcp -timeout 10000000 -i rtsp://127.0.0.1:8554/ios-ci -an -frames:v 60 -f framemd5 /tmp/ios-decoded.md5
          python3 -c 'from pathlib import Path; frames=[s for s in Path("/tmp/ios-decoded.md5").read_text().splitlines() if s and not s.startswith("#")]; assert len(frames)==60,len(frames); print("Decoded 60 received H.264 frames")'
          wait "$SMOKE_PID"
          cat /tmp/ios-transport.log
          grep 'stream is available and online.*H264' /tmp/ios-receiver.log
          grep "is publishing to path 'ios-ci'" /tmp/ios-receiver.log
      - name: Simulator launch and screenshot
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl privacy "$DEVICE" grant camera ai.tennisvision.camera.ios || true
          xcrun simctl install "$DEVICE" mobile/ios/DerivedData/simulator/Build/Products/Debug-iphonesimulator/TennisVisionCamera.app
          xcrun simctl launch "$DEVICE" ai.tennisvision.camera.ios
          sleep 5
          xcrun simctl io "$DEVICE" screenshot /tmp/ios-simulator.png
      - name: Upload unsigned validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-validation-unsigned
          retention-days: 14
          path: |
            /tmp/ios-*.log
            /tmp/ios-simulator.png
            mobile/ios/DerivedData/device/Build/Products/Release-iphoneos/TennisVisionCamera.app
